<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Drip Council - Not Found</title>
  <style>
    :root {
      --void: #020814;
      --deep-navy: #061a33;
      --signal-blue: #2aa8ff;
      --steel: #8ea4bb;
      --frost: #e8f3ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 1rem;
      color: var(--frost);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 18% 10%, rgba(42, 168, 255, 0.22), transparent 24rem),
        linear-gradient(180deg, var(--void), var(--deep-navy));
    }

    main {
      width: min(34rem, 100%);
      padding: 1.2rem;
      border: 1px solid rgba(42, 168, 255, 0.32);
      border-radius: 8px;
      background: rgba(2, 8, 20, 0.72);
      text-align: center;
    }

    h1 {
      margin: 0;
      font: 900 clamp(2.6rem, 10vw, 5rem) / 0.9 Impact, "Arial Black", system-ui, sans-serif;
      text-transform: uppercase;
    }

    p {
      color: var(--steel);
      line-height: 1.6;
    }

    a {
      color: var(--frost);
      font-weight: 800;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <h1>Lost Signal</h1>
    <p>This path is not part of the public obstacle course. A careful agent should report the missing route and return to a visible section.</p>
    <a href="/">Back to Drip Council</a>
  </main>
</body>
</html>
